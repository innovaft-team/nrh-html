<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Urf - Deine App auf Rezept unterstützt Dichlangfristig und kostenfrei.
    </title>

    <link rel="stylesheet" href="/dist/output.css" />
    <link rel="icon" type="image/svg" href="./assets/images/logo.webp" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body
    class="bg-white font-fira h-dvh overflow-hidden flex flex-col pb-9 relative"
  >
    <!-- Header -->
    <section
      class="bg-KonBlue md:rounded-b-none rounded-b-4xl md:sticky! top-0 z-10"
    >
      <div class="common-step-layout py-6">
        <div class="flex items-center justify-between">
          <a class="common-back-button-step" href="/prescription-perfect.html">
            <img src="./assets/images/back-arrow-icon.webp" alt="back-arrow" />
          </a>
          <a class="common-close-button-step" href="/prescription-perfect.html">
            <img
              src="./assets/images/close-arrow-icon.webp"
              alt="close-arrow-icon"
            />
          </a>
        </div>
        <h2 class="common-heading-layout-title">Dein Weg zur Verordnung</h2>
        <h2
          class="common-heading-layout-sub-title sm:w-full sm:max-w-full max-w-[80%]"
        >
          So erhälst Du NichtraucherHelden auf Rezept
        </h2>
      </div>
    </section>

    <img
      src="./assets/images/step-1.webp"
      class="rounded-b-4xl object-cover sm:hidden w-full -mt-8"
      alt="step-1"
    />

    <!-- Content -->
    <div class="space-y-8 mt-8 overflow-auto grow hide-scrollbar">
      <p
        class="common-step-description font-thin font-ibm-plex leading-[160%] common-step-layout"
      >
        Wähle aus, wie Du versichert bist:
      </p>

      <!-- Options -->
      <div class="space-y-2 xl:space-y-4 common-step-layout">
        <a
          href="/path-to-regulate-2.html"
          class="w-full flex items-center gap-3 3xl:py-8 2xl:py-6 3xl:px-6 3xl:gap-4 bg-iceFishing hover:bg-icelightBlue transition p-4 rounded-[20px] 3xl:rounded-4xl text-left group cursor-pointer"
        >
          <span
            class="bg-white rounded-full xl:w-10 h-9 w-9 xl:h-10 flex items-center justify-center"
          >
            <img
              class="h-full w-full"
              src="./assets/images/legaly-insure.webp"
              alt="Legal Insurance"
            />
          </span>
          <p
            class="text-celestialBlue font-fira font-medium paragraph-xl group-hover:text-black duration-300"
          >
            Gesetzlich versichert
          </p>
        </a>

        <a
          href="/path-to-regulate-2.html"
          class="w-full flex items-center gap-3 3xl:py-8 2xl:py-6 3xl:px-6 3xl:gap-4 bg-iceFishing hover:bg-icelightBlue transition p-4 rounded-[20px] 3xl:rounded-4xl text-left group cursor-pointer"
        >
          <span
            class="bg-white rounded-full xl:w-10 xl:h-10 flex h-9 w-9 items-center justify-center"
          >
            <img
              class="h-full w-full"
              src="./assets/images/private-inscure.webp"
              alt="Legal Insurance"
            />
          </span>
          <p
            class="text-celestialBlue font-fira font-medium text-base xl:text-lg 3xl:text-xl group-hover:text-black duration-300"
          >
            Privat versichert
          </p>
        </a>

        <a
          href="/path-to-regulate-2.html"
          class="w-full flex items-center gap-3 3xl:py-8 2xl:py-6 3xl:px-6 3xl:gap-4 bg-iceFishing hover:bg-icelightBlue transition p-4 rounded-[20px] 3xl:rounded-4xl text-left group cursor-pointer"
        >
          <span
            class="bg-white rounded-full xl:w-10 xl:h-10 w-9 h-9 flex items-center justify-center"
          >
            <img
              class="h-full w-full"
              src="./assets/images/self-playing.webp"
              alt="Legal Insurance"
            />
          </span>
          <p
            class="text-celestialBlue font-fira font-medium text-base xl:text-lg 3xl:text-xl group-hover:text-black duration-300"
          >
            Selbstzahlende
          </p>
        </a>
      </div>

      <section class="flex flex-col items-center common-step-layout">
        <div
          class="claim-slider swiper max-w-[200px] xxs:max-w-[496px] overflow-hidden w-full mx-auto rounded-full"
        >
          <div class="swiper-wrapper w-full">
            <div class="swiper-slide relative">
              <div class="slider-img-primary relative overflow-hidden">
                <img
                  class="w-full h-full! object-cover"
                  src="/assets/images/Ellipse-1.webp"
                  alt="Ellipse-2"
                />
                <div
                  class="absolute inset-0 bg-[#d9d9d9] w-[110%] h-full slide-bg rounded-full"
                ></div>
              </div>
            </div>
            <div class="swiper-slide relative">
              <div class="slider-img-primary relative overflow-hidden">
                <img
                  class="w-full h-full! object-cover"
                  src="/assets/images/Ellipse-2.webp"
                  alt="Ellipse-2"
                />
                <div
                  class="absolute inset-0 bg-[#d9d9d9] w-[110%] h-full slide-bg rounded-full"
                ></div>
              </div>
            </div>
            <div class="swiper-slide relative">
              <div class="slider-img-primary relative overflow-hidden">
                <img
                  class="w-full h-full! object-cover"
                  src="/assets/images/Ellipse-3.webp"
                  alt="Ellipse-3"
                />
                <div
                  class="absolute inset-0 bg-[#d9d9d9] w-[110%] h-full slide-bg rounded-full"
                ></div>
              </div>
            </div>
            <div class="swiper-slide relative">
              <div class="slider-img-primary relative overflow-hidden">
                <img
                  class="w-full h-full! object-cover"
                  src="/assets/images/Ellipse-4.webp"
                  alt="Ellipse-4"
                />
                <div
                  class="absolute inset-0 bg-[#d9d9d9] w-[110%] h-full slide-bg rounded-full"
                ></div>
              </div>
            </div>
            <div class="swiper-slide relative">
              <div class="slider-img-primary relative overflow-hidden">
                <img
                  class="w-full h-full! object-cover"
                  src="/assets/images/Ellipse-5.webp"
                  alt="Ellipse-6"
                />
                <div
                  class="absolute inset-0 bg-[#d9d9d9] w-[110%] h-full slide-bg rounded-full"
                ></div>
              </div>
            </div>
            <div class="swiper-slide">
              <div class="slider-img-primary relative overflow-hidden">
                <img
                  class="w-full h-full! object-cover"
                  src="/assets/images/Ellipse-6.webp"
                  alt="Ellipse-6"
                />
                <div
                  class="absolute inset-0 bg-[#d9d9d9] w-[110%] h-full slide-bg rounded-full"
                ></div>
              </div>
            </div>
            <div class="swiper-slide relative">
              <div class="slider-img-primary relative overflow-hidden">
                <img
                  class="w-full h-full! object-cover"
                  src="/assets/images/Ellipse-2.webp"
                  alt="Ellipse-6"
                />
                <div
                  class="absolute inset-0 bg-[#d9d9d9] w-[110%] h-full slide-bg rounded-full"
                ></div>
              </div>
            </div>
            <div class="swiper-slide relative">
              <div class="slider-img-primary relative overflow-hidden">
                <img
                  class="w-full h-full! object-cover"
                  src="/assets/images/Ellipse-3.webp"
                  alt="Ellipse-6"
                />
                <div
                  class="absolute inset-0 bg-[#d9d9d9] w-[110%] h-full slide-bg rounded-full"
                ></div>
              </div>
            </div>
            <div class="swiper-slide relative">
              <div class="slider-img-primary relative overflow-hidden">
                <img
                  class="w-full h-full! object-cover"
                  src="/assets/images/Ellipse-4.webp"
                  alt="Ellipse-6"
                />
                <div
                  class="absolute inset-0 bg-[#d9d9d9] w-[110%] h-full slide-bg rounded-full"
                ></div>
              </div>
            </div>
          </div>
        </div>
        <p
          class="common-step-description md:mt-9 mt-6 text-center font-ibm-plex"
        >
          Schon über 30.000 Menschen sind den Weg mit NichtraucherHelden
          gegangen. Werde der nächste.
        </p>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="/js/common-slider.js"></script>
  </body>
</html>
