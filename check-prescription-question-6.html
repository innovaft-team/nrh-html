<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Urf - Deine App auf Rezept unterstützt Dichlangfristig und kostenfrei.
    </title>

    <link rel="stylesheet" href="/dist/output.css" />
    <link rel="icon" type="image/svg" href="./assets/images/logo.webp" />
  </head>

  <body
    class="bg-white font-fira h-dvh overflow-hidden flex flex-col pb-9 relative"
  >
    <section
      class="bg-KonBlue md:rounded-b-none rounded-b-4xl md:sticky! top-0 z-10"
    >
      <div class="common-step-layout py-6">
        <div class="flex items-center justify-between">
          <a
            class="common-back-button-step"
            href="/check-prescription-question-5.html"
          >
            <img src="./assets/images/back-arrow-icon.webp" alt="back-arrow" />
          </a>
          <a
            class="common-close-button-step"
            href="/check-prescription-question-1.html"
          >
            <img
              src="./assets/images/close-arrow-icon.webp"
              alt="close-arrow-icon"
            />
          </a>
        </div>
        <h2 class="common-heading-layout-title">Der Abhänigkeitstest</h2>
        <h2
          class="common-heading-layout-sub-title sm:w-full sm:max-w-full max-w-[80%]"
        >
          Prüfe, ob du die App auf Rezept erhälst
        </h2>
        <div class="bg-white w-full mt-5 md:mt-6 h-2 rounded-full">
          <div class="w-full bg-blueBay rounded-full h-full"></div>
        </div>
      </div>
    </section>
    <section class="space-y-8 mt-8 overflow-auto grow hide-scrollbar">
      <div class="md:space-y-5 space-y-3.5 common-step-layout">
        <p class="common-step-tag">Frage 6 von 6</p>
        <h4 class="common-heading-layout-sub-heading">
          Hast Du schon mal auf Dinge im Leben verzichtet, weil Du dort nicht
          rauchen konntest?
        </h4>
      </div>
      <div class="space-y-2 md:space-y-4 common-step-layout">
        <button class="common-step-radio-buttons js-radio-btn">Ja</button>
        <button class="common-step-radio-buttons js-radio-btn">Nein</button>
      </div>
    </section>
    <div
      class="grid grid-cols-2 lg:gap-8 md:gap-6 gap-4 common-step-layout lg:mt-14 md:mt-12 sm:mt-10 mt-9"
    >
      <a class="secondary-button" href="/check-prescription-question-5.html"
        >Zurück</a
      >
      <a
        class="primary-button next-btn is-disabled is-active"
        href="prescription-claim.html"
        >Weiter</a
      >
    </div>
    <script src="/js/common-step.js"></script>
  </body>
</html>
